<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>MAQON — Pós-venda</title><style>body{background:#071116;color:#fff;font:14px Arial;margin:30px}main{max-width:1050px;margin:auto}h1,h2{color:#f4c300}.card{background:#101d22;border:1px solid #334249;border-radius:8px;padding:18px;margin:15px 0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{color:#b8c4c8}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;background:#071116;border:1px solid #47575e;color:#fff;border-radius:5px}.full{grid-column:1/-1}button{margin:15px 8px 0 0;padding:12px 16px;border:0;border-radius:6px;background:#f4c300;font-weight:bold}.green{background:#2d8b57;color:#fff}@media(max-width:700px){.g{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main id="app"></main><script src="maqon-pos-venda.js"></script></body></html>
