<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>MAQON — Análise Técnica</title><style>*{box-sizing:border-box}body{margin:0;background:#071116;color:#eef4f6;font:14px Arial}main{max-width:1100px;margin:25px auto;padding:20px}h1,h2{color:#f4c300}.sub{color:#9dacb2}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:18px 0}.summary div,form,#result{background:#101d22;border:1px solid #334249;border-radius:8px;padding:12px}.summary small{display:block;color:#91a2a9;font-size:10px;margin-bottom:5px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-size:11px;color:#b8c4c8}input,textarea{display:block;width:100%;margin-top:5px;padding:10px;background:#071116;border:1px solid #47575e;border-radius:5px;color:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:9px;margin-top:16px}button{border:0;border-radius:6px;background:#f4c300;padding:11px 14px;font-weight:bold;cursor:pointer}.secondary{background:#26363c;color:white}#result{margin-top:15px}#result:empty{display:none}#result strong{font-size:34px;color:#f4c300}@media(max-width:800px){.summary,.g{grid-template-columns:1fr 1fr}}</style></head><body><main id=app></main><script src=maqon-analise.js></script></body></html>
