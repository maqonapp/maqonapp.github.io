<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAQON — Central de Automações</title><style>
*{box-sizing:border-box}body{margin:0;background:#071116;color:#eef4f6;font:14px Arial}main{max-width:1200px;margin:25px auto;padding:20px}
h1,h2{color:#f4c300}.card{background:#101d22;border:1px solid #334249;border-radius:8px;padding:18px;margin:15px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;color:#f4c300;font-size:28px;margin-top:5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #334249}th{color:#f4c300}
.badge{display:inline-block;padding:5px 8px;border-radius:12px;background:#26363c}.empty{color:#8fa0a6;padding:25px;text-align:center}
button{border:0;border-radius:6px;background:#f4c300;padding:10px 14px;font-weight:bold;cursor:pointer}
@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}}
</style></head><body><button id="maqon-global-back" type="button" onclick="location.href='index.html'" style="position:fixed;right:18px;top:16px;z-index:9999;background:#ffc400;color:#05090c;border:0;border-radius:6px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px #0008">← Voltar à MAQON</button><main id="app"></main><script src="maqon-historico.js"></script><button id="maqon-back-btn" type="button" onclick="if(history.length>1){history.back()}else{location.href='index.html'}" style="position:fixed;top:14px;right:18px;z-index:99999;background:#ffc400;color:#080d10;border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer;box-shadow:0 3px 12px #0006">← Voltar</button>
</body></html>
