<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>MAQON — Diagnóstico</title><style>body{background:#081116;color:white;font:14px Arial;margin:0}.w{max-width:760px;margin:30px auto;padding:24px;background:#101b20;border-radius:12px}h1{color:#f2c100}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:11px;color:#b8c0c4;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;background:#071014;color:white;border:1px solid #4a575d;border-radius:6px}.full{grid-column:1/-1}button{background:#f2c100;border:0;padding:12px 18px;font-weight:bold;border-radius:6px}.ok{margin-top:15px;color:#f2c100;font-weight:bold}@media(max-width:600px){.g{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class=w><h1>MAQON — Diagnóstico Inicial</h1><form id=f><div class=g><div><label>Nome</label><input name=nome required></div><div><label>Empresa</label><input name=empresa></div><div><label>WhatsApp</label><input name=whatsapp></div><div><label>E-mail</label><input name=email type=email></div><div><label>Estado/UF</label><input name=estado></div><div><label>Cidade</label><input name=cidade></div><div><label>Objetivo</label><select name=objetivo><option></option><option>Comprar equipamento</option><option>Alugar equipamento</option><option>Comparar opções</option><option>Reduzir custo operacional</option><option>Planejar manutenção</option></select></div><div><label>Compra / Locação</label><select name=compraLocacao><option></option><option>Compra</option><option>Locação</option><option>A definir</option></select></div><div><label>Tipo de equipamento</label><input name=tipoEquipamento></div><div><label>Marca / Modelo</label><input name=marcaModelo></div><div><label>Orçamento</label><input name=orcamento></div><div><label>Prazo</label><input name=prazo></div><div class=full><label>Observações</label><textarea name=observacoes rows=4></textarea></div><div class=full><button>Registrar lead</button></div></div></form><div id=ok class=ok></div></div><script src=maqon-automacoes.js></script><script>f.onsubmit=e=>{e.preventDefault();let l=MAQON_AUTOMATION.addLead(Object.fromEntries(new FormData(f)));ok.textContent=l.id+' registrado — '+l.status+' — Score '+l.score+'/100 — Próxima ação: '+MAQON_AUTOMATION.nextAction(l);f.reset()}</script></body></html>
