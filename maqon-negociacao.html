<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>MAQON — Negociação</title><style>*{box-sizing:border-box}body{margin:0;background:#071116;color:#eef4f6;font:14px Arial}main{max-width:1100px;margin:25px auto;padding:20px}h1,h2{color:#f4c300}section,form,#ok{background:#101d22;border:1px solid #334249;border-radius:8px;padding:16px;margin:15px 0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:11px;color:#b8c4c8}input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;background:#071116;border:1px solid #47575e;border-radius:5px;color:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:16px}button{border:0;border-radius:6px;background:#f4c300;padding:11px 14px;font-weight:bold;cursor:pointer}#neg{background:#26363c;color:#fff}#win{background:#2d8b57;color:#fff}#ok:empty{display:none}#ok b{color:#f4c300}@media(max-width:700px){.g{grid-template-columns:1fr}}</style></head><body><main id=app></main><script src=maqon-negociacao.js></script></body></html>
